name: Update FMS AI Models & Team Ratings (Unified 15-League API)

on:
  # Runs automatically 3 times a week (Monday, Wednesday, Friday at 06:00 UTC)
  schedule:
    - cron: '0 6 * * 1,3,5'
  # Allows manual 1-click execution from the GitHub "Actions" tab at any time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FMS-The-Game-Data repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Unified 15-League AI Models & Ratings Updater
        run: python tools/update_models_and_ratings.py

      - name: Commit and push updated models & archive JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fms_models_and_ratings.json data/espn_matches_archive.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): auto-update FMS AI models & team ratings"
            git push
          fi
